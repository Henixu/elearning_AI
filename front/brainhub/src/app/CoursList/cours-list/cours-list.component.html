<div class="projects-section">
  <h2 class="mb-4 text-center">Recommandations:</h2>
  <div class="slider-container">
    <button class="slider-btn prev-btn" (click)="prevSlide()">&#8249;</button>
    <div class="slider-wrapper">
      <!-- Loop through the rec array -->
      <div class="slider-card" *ngFor="let cour of rec">
        <div class="project-card bg-white p-4 rounded shadow">
          <img [src]="cour.image" alt="Course Image" class="course-image rounded mb-3" />
          <h3 class="course-title">{{ cour.titre }}</h3>
          <div class="badge">{{ cour.niveau_difficulte }}</div>
          
          <br>
          <button 
          class="btn btn-primary mt-3" 
          (click)="addCourseToLearner(cour.id)">Add Course</button>
          <button class="btn btn-secondary" (click)="viewCourseDetails(cour.id)">Details </button>
        </div>
      </div>
    </div>
    <button class="slider-btn next-btn" (click)="nextSlide()">&#8250;</button>
  </div>
</div>

    <h2 class="mb-4">Cours:</h2>
       <div class="search-container mb-4">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search courses..." 
          [(ngModel)]="searchQuery" 
          (input)="filterCourses()" />
      </div>
      <div class="row">
        <!-- Loop through the filteredCours array -->
        <div class="col-md-6 mb-3" *ngFor="let cour of filteredCours">
          <div class="project-card bg-light p-3 rounded shadow-sm">
            <img [src]="cour.image" alt="Course Image" class="img-fluid rounded mb-3" />
            <span class="date text-muted">{{ cour.titre }}</span>
            
            <p>{{ cour.description }}</p>
            <div 
              class="badge" 
              [ngClass]="{
                'badge-warning': cour.niveau_difficulte === 'débutant',
                'badge-primary': cour.niveau_difficulte === 'intermédiaire',
                'badge-danger': cour.niveau_difficulte === 'avancé'
              }">
              {{ cour.niveau_difficulte }}
            </div>
            <button 
            class="btn btn-primary mt-3" 
            (click)="addCourseToLearner(cour.id)">Add Course</button>
            <button class="btn btn-secondary" (click)="viewCourseDetails(cour.id)">Details </button>
          </div>
        </div>
      </div>
